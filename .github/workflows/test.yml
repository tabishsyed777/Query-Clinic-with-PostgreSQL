name: PostgreSQL tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinic_local_demo
          POSTGRES_DB: clinic
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U clinic -d clinic"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://clinic:clinic_local_demo@localhost:5432/clinic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python clinic.py seed
      - run: pytest -q
